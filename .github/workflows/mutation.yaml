name: mutation

# The hourly mutation run on what merged to main (mutation testing runs on a schedule against main, not in a pull request), here on a CI runner instead of the laptop.
# It starts itself, so no person or session has to remember it (a session that dispatched it each
# hour stopped on 2026-11-13, and nothing ran for 13 days):
#
#   - on a push to main, and on an hourly cron as the catch-up. The `gate` job (mutation-gate.mjs, the same
#     shape as scheduled.yaml's gate) lets either start the work only when no run of this workflow
#     started its job within the gap (`MUTATION_GAP_MINUTES`, default 60) and the head is not one a
#     passing run already covered: at most 24 runs a day. GitHub's cron fires only about 3 times a
#     day on this repo (34 starts in 11.7 days, measured on scheduled.yaml), so the push is the real
#     clock and the cron the backup;
#   - by hand, which the gate always lets through, to re-run or to skip a range:
#
#       gh workflow run mutation.yaml -f base=<the commit to mutate from>
#
# The base is the commit the last passing run ended at, read from GitHub's own run list by the
# gate (a run counts as passing when its `mutation` job passed, so a run the gate skipped never
# counts), and a failed range is tried again by the next run. The `range` step cuts the range to
# `MUTATION_MAX_RELATED` related test files (default 12), moving the base forward along main until it
# fits, because mutbox stops the container at 900 s: a range of hundreds of test files could never
# pass and would only grow. The summary says how many commits that left unmutated. A merge never
# waits on this run. It runs the same command
# the laptop runs (mutbox.ts, a step that needs ports or its own processes and network isolation runs in a container): Stryker in a container with `--network none`, the
# fixed seed 119120 and a sample of at most 150, both set in run.sh. Survivors are its answer, not a
# failure: the job fails only when the run itself broke (mutbox's `stuck`). It reads, runs the
# container and uploads its result; it changes nothing in the repo, and it files no ticket: a CI job
# cannot reach the local tracker, so a survivor is read from the artifact and the job summary for now.
#
# `mutation-heartbeat.yaml` watches the outcome, not the starter: it goes red and opens one issue when a
# merge on main has waited past its limit for a passing run, whichever way the runs stopped.
on:
  push:
    branches: [main]
  schedule:
    # Not at the top of the hour, when GitHub's load is highest.
    - cron: "31 * * * *"
  workflow_dispatch:
    inputs:
      base:
        description: The commit to mutate from; empty means the commit the last passing run on main ended at
        required: false
        default: ""
        type: string
      head:
        description: The commit to mutate up to; empty means the commit that started the run (main's head on a push or the cron)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # The `range` step reads the last passing run from the run list.
  actions: read

# One run at a time, and a running one is never cut short. A run that starts while one is running waits,
# and only the newest waiting run is kept (GitHub replaces an older one with it), so a burst of merges
# costs one more run that mutates up to the newest head, not one per merge.
concurrency:
  group: mutation
  cancel-in-progress: false

# The settings, read by mutation-gate.mjs and range.ts: the gap between two runs of the work, in minutes, and the most
# related test files one run takes (mutbox's 900 s container limit is what bounds it).
env:
  MUTATION_GAP_MINUTES: "60"
  MUTATION_MAX_RELATED: "12"

jobs:
  # Whether this run does the work (mutation-gate.mjs). A run whose gate said `false` ends `success` in seconds with
  # `mutation` skipped, and the heartbeat does not count it as a pass. It runs while its own run holds the
  # concurrency group, so every run ahead of it has ended. No install: Node alone runs mutation-gate.mjs.
  gate:
    # Main's copy of the workflow and of mutation-gate.mjs, never a branch's.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      start: ${{ steps.gate.outputs.start }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ inputs.head || github.sha }}
        run: node .github/ci/mutation-gate.mjs --workflow mutation.yaml --job mutation --head "$HEAD"

  mutation:
    needs: [gate]
    # Main's copy of the workflow and of mutbox.ts, never a branch's.
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.start == 'true'
    # mutbox.ts measured only linux/arm64 (its PLATFORM), and this is the free arm64 runner for a
    # public repository: 4 CPUs, 16 GB, Docker installed.
    runs-on: ubuntu-24.04-arm
    # The image build (pnpm fetch of the whole lockfile) and the install come first, then mutbox's
    # own 900 s limit on the container with a base. About twice that sum, unmeasured on a runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # mutbox.ts fetches the base and the head from this checkout, so it must hold both.
          fetch-depth: 0

      # pnpm and Node, with no store cache: restoring one did not pay, and even a save on main
      # holds about half a gigabyte of the repository's 10 GB (.github/actions/pnpm).
      - uses: ./.github/actions/pnpm

      # For mutbox.ts itself (Effect and oxc-parser); the container installs its own copy offline.
      - run: pnpm install --frozen-lockfile

      # The tests beside the changed files (mutation testing runs on a schedule against main, not in a pull request): for each changed product file, its own
      # `name.test.ts` or `name.test.tsx` at head and each `name.<kind>.test.ts` sibling (testing,
      # linting and formatting live in @kalfa/quality, slice 2), and each changed test file. Of the lead tooling,
      # only quest code is in (the hourly mutation run also tests the lead tooling's quest code). scope.ts holds that rule and sample.ts's PRODUCT list, so this
      # pick and the sample's diff are one rule. A path mutbox.ts's --related would refuse is left
      # out. range.ts runs that pick and cuts the range to `MUTATION_MAX_RELATED` of them.
      #
      # The base is the commit the last passing run on main ended at (the gate read it), unless a hand
      # dispatch gives one. A run that failed is no passing run, so its range is read again by the next
      # one. With no passing run at all, the range is the head's own commit.
      - id: range
        env:
          BASE: ${{ inputs.base || needs.gate.outputs.base }}
          HEAD: ${{ inputs.head || github.sha }}
        run: |
          head=$(git rev-parse --verify "$HEAD^{commit}")
          base=$(git rev-parse --verify "${BASE:-$head^}^{commit}")
          node .agents/skills/mutation/scripts/range.ts --base "$base" --head "$head" > "$RUNNER_TEMP/range.txt"
          cat "$RUNNER_TEMP/range.txt"
          { cat "$RUNNER_TEMP/range.txt"; echo "head=$head"; echo "first=$base"; } >> "$GITHUB_OUTPUT"

      # mutbox exits 0 for done (survivors included) and 40 for skip; both pass. 30 is stuck, the
      # run broke, and fails the job. Its JSON line is in $OUT/mutbox.json either way.
      - name: mutbox
        if: steps.range.outputs.related != ''
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          RELATED: ${{ steps.range.outputs.related }}
          OUT: ${{ runner.temp }}/mutbox
        run: |
          code=0
          node .agents/skills/lead/scripts/mutbox.ts run --checkout . --ticket 0 \
            --build "$HEAD" --base "$BASE" --related "$RELATED" \
            --out "$OUT" --lock "$RUNNER_TEMP/docker.lock" || code=$?
          case $code in 0 | 40) exit 0 ;; *) exit "$code" ;; esac

      - name: summary
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          RELATED: ${{ steps.range.outputs.related }}
          FIRST: ${{ steps.range.outputs.first }}
          LEFT: ${{ steps.range.outputs.left }}
          WANTED: ${{ steps.range.outputs.wanted }}
          JSON: ${{ runner.temp }}/mutbox/mutbox.json
        run: |
          {
            echo "## mutation"
            echo
            echo "range \`$BASE..$HEAD\`"
            echo
            if [ "${LEFT:-0}" != "0" ]; then
              echo "cut: $LEFT commits after \`$FIRST\` were left unmutated: the whole range holds $WANTED related test files and the cap is $MUTATION_MAX_RELATED"
              echo
            fi
            if [ -z "$BASE" ]; then
              echo "no run: base or head is not a commit on main's history"
            elif [ -z "$RELATED" ]; then
              echo "skip: no test beside a changed file in scope, so nothing ran"
            elif [ ! -s "$JSON" ]; then
              echo "no result: mutbox wrote no mutbox.json"
            else
              jq -r '
                (.b.counts // {}) as $c
                | (.sample.selected // 0) as $n
                | (($c.Killed // 0) + ($c.Timeout // 0) + ($c.Survived // 0)) as $judged
                | "outcome: \(.outcome) \(.reason)",
                  "",
                  "| mutants | killed | timeout | survived | no answer | narrowed | seconds |",
                  "|---|---|---|---|---|---|---|",
                  "| \($n) | \($c.Killed // 0) | \($c.Timeout // 0) | \($c.Survived // 0) | \($n - $judged) | \(if (.narrowing | type) == "array" then (.narrowing | length) else (.narrowing // "none") end) | \(.seconds) |",
                  "",
                  (.reach // empty),
                  "",
                  (.detail | select(. != ""))
              ' "$JSON"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One artifact per run, always named `mutbox`: the JSON line, Stryker's reports and samples,
      # and the logs a stuck reason points at.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutbox
          path: |
            ${{ runner.temp }}/mutbox/mutbox.json
            ${{ runner.temp }}/mutbox/box/*.txt
            ${{ runner.temp }}/mutbox/box/*.json
            ${{ runner.temp }}/mutbox/box/a/
            ${{ runner.temp }}/mutbox/box/b/
            !${{ runner.temp }}/mutbox/box/*/events
          if-no-files-found: ignore
