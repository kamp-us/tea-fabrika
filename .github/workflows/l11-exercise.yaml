# Today's manual measurements. This workflow supplies no branch proof.
name: l11-exercise
on:
  workflow_dispatch:
    inputs:
      case:
        description: Fixed L11 measurement or temporary fault
        required: true
        type: choice
        options:
          - l11-compare
          - l11-inputs
          - l11-batch
          - l11-reply
          - l11-span-name
          - l11-span-code
          - l11-span-errcode
          - l11-log
          - l11-row
      sha:
        description: Exact cached source commit
        required: true
        type: string
        default: 461d3f93a8c3d84fc25e8139493c59cab5632ebd
permissions:
  contents: read
jobs:
  manifest:
    name: l11-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.case == 'l11-batch'
    steps:
      - &a1
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - &a2
        name: trusted main
        run: |-
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/l11-exercise.yaml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
      - &a3
        uses: actions/checkout@v7
        with:
          ref: 461d3f93a8c3d84fc25e8139493c59cab5632ebd
          path: source-cached
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - &a4
        uses: actions/checkout@v7
        with:
          ref: e3754f43e9b9cc27f2bf44918e8d657f2a863c9d
          path: source-uncached
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - &a5
        name: verify exact source before setup
        run: |-
          test "$(git -C source-cached rev-parse HEAD)" = 461d3f93a8c3d84fc25e8139493c59cab5632ebd
          test "$(git -C source-uncached rev-parse HEAD)" = e3754f43e9b9cc27f2bf44918e8d657f2a863c9d
          test -d 'source-cached' && test ! -L 'source-cached'
          test -d 'source-cached/next' && test ! -L 'source-cached/next'
          test -d 'source-cached/next/apps' && test ! -L 'source-cached/next/apps'
          test -d 'source-cached/next/apps/fabrika' && test ! -L 'source-cached/next/apps/fabrika'
          test -d 'source-cached/next/apps/fabrika/src' && test ! -L 'source-cached/next/apps/fabrika/src'
          test -d 'source-cached/next/packages' && test ! -L 'source-cached/next/packages'
          test -d 'source-cached/next/packages/libfabrika' && test ! -L 'source-cached/next/packages/libfabrika'
          test -d 'source-cached/next/packages/libfabrika/src' && test ! -L 'source-cached/next/packages/libfabrika/src'
          test -d 'source-cached/next/packages/libfabrika/src/cloudflare' && test ! -L 'source-cached/next/packages/libfabrika/src/cloudflare'
          test -d 'source-cached/next/packages/libfabrika/src/processes' && test ! -L 'source-cached/next/packages/libfabrika/src/processes'
          test -d 'source-uncached' && test ! -L 'source-uncached'
          test -d 'source-uncached/next' && test ! -L 'source-uncached/next'
          test -d 'source-uncached/next/apps' && test ! -L 'source-uncached/next/apps'
          test -d 'source-uncached/next/apps/fabrika' && test ! -L 'source-uncached/next/apps/fabrika'
          test -d 'source-uncached/next/apps/fabrika/src' && test ! -L 'source-uncached/next/apps/fabrika/src'
          test -d 'source-uncached/next/packages' && test ! -L 'source-uncached/next/packages'
          test -d 'source-uncached/next/packages/libfabrika' && test ! -L 'source-uncached/next/packages/libfabrika'
          test -d 'source-uncached/next/packages/libfabrika/src' && test ! -L 'source-uncached/next/packages/libfabrika/src'
          test -d 'source-uncached/next/packages/libfabrika/src/cloudflare' && test ! -L 'source-uncached/next/packages/libfabrika/src/cloudflare'
          test -d 'source-uncached/next/packages/libfabrika/src/processes' && test ! -L 'source-uncached/next/packages/libfabrika/src/processes'
          test -f 'pnpm-lock.yaml' && test ! -L 'pnpm-lock.yaml'
          printf '%s\n' '02d1d1c629105e240ea3b473df3dbb0f89874cfaf5f57352c6d8492da133da4c  pnpm-lock.yaml' | sha256sum --check --status
          test -f 'source-cached/pnpm-lock.yaml' && test ! -L 'source-cached/pnpm-lock.yaml'
          printf '%s\n' '02d1d1c629105e240ea3b473df3dbb0f89874cfaf5f57352c6d8492da133da4c  source-cached/pnpm-lock.yaml' | sha256sum --check --status
          test -f 'source-cached/pnpm-workspace.yaml' && test ! -L 'source-cached/pnpm-workspace.yaml'
          printf '%s\n' '2dbe2a8e5e781cefa412fb2a43723b6dad1c8586bb49948d5d79eb1f81bef758  source-cached/pnpm-workspace.yaml' | sha256sum --check --status
          test -f 'source-cached/next/apps/fabrika/src/start-child.laws.integration.test.ts' && test ! -L 'source-cached/next/apps/fabrika/src/start-child.laws.integration.test.ts'
          printf '%s\n' '9eae1ecb08f3db5834a8c5de8488773ddf280f8f058971725321156d15d083e0  source-cached/next/apps/fabrika/src/start-child.laws.integration.test.ts' | sha256sum --check --status
          test -f 'source-cached/next/packages/libfabrika/src/cloudflare/runtime.ts' && test ! -L 'source-cached/next/packages/libfabrika/src/cloudflare/runtime.ts'
          printf '%s\n' '175ceddc78e5bf30a68abc3c9d826175f7a8afc7611f247fa2c3bccd41aeaf05  source-cached/next/packages/libfabrika/src/cloudflare/runtime.ts' | sha256sum --check --status
          test -f 'source-cached/next/packages/libfabrika/src/processes/ChildrenLedger.ts' && test ! -L 'source-cached/next/packages/libfabrika/src/processes/ChildrenLedger.ts'
          printf '%s\n' 'f4a3d647242f362c5b6292e54eae107d936331469aee9b7a2c44a1b316f1ab51  source-cached/next/packages/libfabrika/src/processes/ChildrenLedger.ts' | sha256sum --check --status
          test -f 'source-uncached/pnpm-lock.yaml' && test ! -L 'source-uncached/pnpm-lock.yaml'
          printf '%s\n' '02d1d1c629105e240ea3b473df3dbb0f89874cfaf5f57352c6d8492da133da4c  source-uncached/pnpm-lock.yaml' | sha256sum --check --status
          test -f 'source-uncached/pnpm-workspace.yaml' && test ! -L 'source-uncached/pnpm-workspace.yaml'
          printf '%s\n' '2dbe2a8e5e781cefa412fb2a43723b6dad1c8586bb49948d5d79eb1f81bef758  source-uncached/pnpm-workspace.yaml' | sha256sum --check --status
          test -f 'source-uncached/next/apps/fabrika/src/start-child.laws.integration.test.ts' && test ! -L 'source-uncached/next/apps/fabrika/src/start-child.laws.integration.test.ts'
          printf '%s\n' '8c38d7ff077aa796420ac76881be179a12b3461b60e5db05897b2a20727809cb  source-uncached/next/apps/fabrika/src/start-child.laws.integration.test.ts' | sha256sum --check --status
          test -f 'source-uncached/next/packages/libfabrika/src/cloudflare/runtime.ts' && test ! -L 'source-uncached/next/packages/libfabrika/src/cloudflare/runtime.ts'
          printf '%s\n' '175ceddc78e5bf30a68abc3c9d826175f7a8afc7611f247fa2c3bccd41aeaf05  source-uncached/next/packages/libfabrika/src/cloudflare/runtime.ts' | sha256sum --check --status
          test -f 'source-uncached/next/packages/libfabrika/src/processes/ChildrenLedger.ts' && test ! -L 'source-uncached/next/packages/libfabrika/src/processes/ChildrenLedger.ts'
          printf '%s\n' 'f4a3d647242f362c5b6292e54eae107d936331469aee9b7a2c44a1b316f1ab51  source-uncached/next/packages/libfabrika/src/processes/ChildrenLedger.ts' | sha256sum --check --status
      - &a6
        uses: ./.github/actions/pnpm
      - &a7
        name: install trusted tooling privately
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/l11-trusted-install.log" 2>&1
      - id: l11
        run: nice -n 19 node .github/ci/l11-exercise.ts
        timeout-minutes: 17
        env:
          L11_CASE: ${{ inputs.case }}
          L11_SHA: ${{ inputs.sha }}
          L11_MODE: manifest
      - name: sanitized observations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l11-exercise-manifest
          path: ${{ runner.temp }}/l11-exercise/public/*.json
          if-no-files-found: error
  compare:
    name: l11-compare-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.case == 'l11-compare'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        variant:
          - uncached
          - cached
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - id: l11
        run: nice -n 19 node .github/ci/l11-exercise.ts
        timeout-minutes: 17
        env:
          L11_CASE: ${{ inputs.case }}
          L11_SHA: ${{ inputs.sha }}
          L11_MODE: compare
          L11_VARIANT: ${{ matrix.variant }}
      - name: sanitized observations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l11-exercise-compare-${{ matrix.variant }}
          path: ${{ runner.temp }}/l11-exercise/public/*.json
          if-no-files-found: error
  inputs:
    name: l11-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.case == 'l11-inputs'
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - id: l11
        run: nice -n 19 node .github/ci/l11-exercise.ts
        timeout-minutes: 17
        env:
