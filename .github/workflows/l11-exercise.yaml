          name: l11-exercise-inputs
          path: ${{ runner.temp }}/l11-exercise/public/*.json
          if-no-files-found: error
  output:
    name: l11-output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.case != 'l11-compare' && inputs.case != 'l11-inputs' && inputs.case != 'l11-batch'
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - id: l11
        run: nice -n 19 node .github/ci/l11-exercise.ts
        timeout-minutes: 17
        env:
          L11_CASE: ${{ inputs.case }}
          L11_SHA: ${{ inputs.sha }}
          L11_MODE: output
      - name: sanitized observations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l11-exercise-output
          path: ${{ runner.temp }}/l11-exercise/public/*.json
          if-no-files-found: error
  slot-1:
    name: l11-slot-1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.case == 'l11-batch'
    needs:
      - manifest
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - id: l11
