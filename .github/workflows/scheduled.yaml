name: scheduled provider acceptance probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-provider-acceptance-probe-1137
  queue: max
  cancel-in-progress: false
jobs:
  provider:
    name: provider (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: scheduled-test-${{ fromJSON('{"e2e-1":"1","e2e-2":"2","1":"3","2":"4","3":"5","4":"6","5":"7","tooling-1":"8","tooling-2":"9"}')[matrix.shard] }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - shard: "e2e-1"
            slot: "1"
          - shard: "e2e-2"
            slot: "2"
          - shard: "1"
            slot: "3"
          - shard: "2"
            slot: "4"
          - shard: "3"
            slot: "5"
          - shard: "4"
            slot: "6"
          - shard: "5"
            slot: "7"
          - shard: "tooling-1"
            slot: "8"
          - shard: "tooling-2"
            slot: "9"
    steps:
      - name: Verify provider expression mapping
        env:
          ACTUAL_GROUP: scheduled-test-${{ fromJSON('{"e2e-1":"1","e2e-2":"2","1":"3","2":"4","3":"5","4":"6","5":"7","tooling-1":"8","tooling-2":"9"}')[matrix.shard] }}
          EXPECTED_SLOT: ${{ matrix.slot }}
          SOURCE_SHARD: ${{ matrix.shard }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$ACTUAL_GROUP" = "scheduled-test-$EXPECTED_SLOT"
          printf 'shard=%s group=%s workflow_sha=%s run=%s attempt=%s\n' "$SOURCE_SHARD" "$ACTUAL_GROUP" "$WORKFLOW_SHA" "$RUN_ID" "$RUN_ATTEMPT"
