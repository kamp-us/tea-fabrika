name: scheduled queue semantics probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  admission:
    if: github.ref == 'refs/heads/fabrikalfa/ci-queue-probe-a' || github.ref == 'refs/heads/fabrikalfa/ci-queue-probe-b'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    concurrency:
      group: scheduled-control
      queue: max
      cancel-in-progress: false
    steps:
      - name: Record workflow admission
        env:
          REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'admitted=%s ref=%s source=%s workflow=%s run=%s attempt=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$REF" "$SOURCE_SHA" "$WORKFLOW_SHA" "$RUN_ID" "$ATTEMPT"
  hold:
    needs: admission
    if: github.ref == 'refs/heads/fabrikalfa/ci-queue-probe-a' || github.ref == 'refs/heads/fabrikalfa/ci-queue-probe-b'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ fromJSON('{"refs/heads/fabrikalfa/ci-queue-probe-a":"scheduled-test-1","refs/heads/fabrikalfa/ci-queue-probe-b":"scheduled-test-2"}')[github.ref] }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Fixed sixty second hold
        timeout-minutes: 2
        env:
          REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SLOT: ${{ fromJSON('{"refs/heads/fabrikalfa/ci-queue-probe-a":"scheduled-test-1","refs/heads/fabrikalfa/ci-queue-probe-b":"scheduled-test-2"}')[github.ref] }}
        run: |
          printf 'start=%s ref=%s source=%s workflow=%s run=%s attempt=%s slot=%s hold_seconds=60\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$REF" "$SOURCE_SHA" "$WORKFLOW_SHA" "$RUN_ID" "$ATTEMPT" "$SLOT"
          sleep 60
          printf 'end=%s run=%s attempt=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$RUN_ID" "$ATTEMPT"
