name: scheduled live adapter proof operation
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: scheduled-live-adapter-proof-1137
  queue: max
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scheduled-control
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          ref: 3267f66a311776f5ab3951158b172904a5a0e2da
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        timeout-minutes: 2
      - name: Install pinned dependencies
        timeout-minutes: 3
        run: env -u TYPESAFE_API_KEY pnpm install --frozen-lockfile
      - name: Exercise fixed proof operation
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROBE_WORKFLOW_REF: ${{ github.workflow_ref }}
          PROBE_RUN_ID: ${{ github.run_id }}
          PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const source = "3267f66a311776f5ab3951158b172904a5a0e2da";
          const repo = "kamp-us/tea-fabrika";
          const branch = "fabrikalfa/ci-ref-queues";
          const head = "3267f66a311776f5ab3951158b172904a5a0e2da";
          const checker = ".github/ci/workflow-lint/scheduled.ts";
          const laws = ".github/ci/workflow-lint/scheduled.integration.test.ts";
          const preflight = ".agents/skills/lead/scripts/ci/preflight.ts";
          const checkerHash = "5aab82ac48cb627645eec88484060be443ffe5419a2d55dfb8198539ca01c743";
          const workflowHash = "f795c35b9a789f106330f8defdbe890f70290e66b5e39d89eb10f68e37bec6b0";
          const lawsHash = "fa80ff432463ab04ff0522ce744d001e2d7ef6a1bac7a34e87524495da958443";
          const positiveLaw = "property: the stdin CLI confirms shared job slots without requiring full-workflow conformance";
          const output = join(process.env.RUNNER_TEMP, "ci-live-adapter-proof");
          mkdirSync(output, { recursive: true });

          const hash = (text) => createHash("sha256").update(text).digest("hex");
          const clean = (text) => process.env.GH_TOKEN ? text.replaceAll(process.env.GH_TOKEN, "[redacted]") : text;
          const safeEnv = { ...process.env };
          delete safeEnv.GH_TOKEN;
          delete safeEnv.GITHUB_TOKEN;
          delete safeEnv.TYPESAFE_API_KEY;
          const records = [];
          const metadata = {
            source,
            requestedBranch: branch,
            requestedHead: head,
            workflowSha: process.env.PROBE_WORKFLOW_SHA,
            workflowRef: process.env.PROBE_WORKFLOW_REF,
            run: process.env.PROBE_RUN_ID,
            attempt: process.env.PROBE_RUN_ATTEMPT,
            node: process.version,
            checkerHash,
            workflowHash,
            lawsHash,
            result: "incomplete",
          };

          const save = () => writeFileSync(join(output, "evidence.json"), JSON.stringify({ metadata, records }, null, 2));
          const run = (name, cmd, args, timeout, authenticated = false) => {
            const started = new Date().toISOString();
            const at = performance.now();
            const child = spawnSync(cmd, args, {
              encoding: "utf8",
              timeout,
              maxBuffer: 16 * 1024 * 1024,
              env: authenticated ? { ...safeEnv, GH_TOKEN: process.env.GH_TOKEN } : safeEnv,
            });
            const stdout = clean(child.stdout ?? "");
            const stderr = clean(child.stderr ?? "");
            writeFileSync(join(output, `${name}.stdout`), stdout);
            writeFileSync(join(output, `${name}.stderr`), stderr);
            records.push({ name, cmd, args, started, ended: new Date().toISOString(), elapsedMs: performance.now() - at,
              status: child.status, signal: child.signal, error: child.error ? clean(child.error.message) : null });
            save();
            assert.equal(child.error, undefined, `${name} could not finish`);
            assert.equal(child.signal, null, `${name} ended by a signal`);
            return { status: child.status, stdout, stderr };
          };

          const fiveLaws = (name, failed) => {
            const report = join(output, `${name}.json`);
            const result = run(name, "pnpm", ["exec", "vitest", "run", "--project", "tooling", "--maxWorkers=1",
              "--fileParallelism=false", "--reporter=default", "--reporter=json", `--outputFile.json=${report}`, laws], 120000);
            const text = clean(readFileSync(report, "utf8"));
            writeFileSync(report, text);
            const json = JSON.parse(text);
            assert.equal(json.numTotalTests, 5, `${name} must execute exactly five properties`);
            assert.equal(json.numPendingTests, 0, `${name} must not skip properties`);
            assert.equal(json.numTodoTests, 0, `${name} must not leave todo properties`);
            assert.equal(json.numPassedTests, failed ? 0 : 5, `${name} pass count`);
            assert.equal(json.numFailedTests, failed ? 5 : 0, `${name} failure count`);
            const assertions = json.testResults.flatMap((file) => file.assertionResults);
            const positive = assertions.find((law) => law.title === positiveLaw);
            assert(positive, `${name} positive sentinel property must be present`);
            assert.equal(positive.status, failed ? "failed" : "passed", `${name} positive sentinel property`);
            assert.equal(result.status === 0, !failed, `${name} exit must agree with assertions`);
          };

          const original = readFileSync(checker);
          const originalLaws = readFileSync(laws);
          let changed = false;
          try {
            assert(!branch.includes("REQUIRED") && /^[0-9a-f]{40}$/.test(head), "root must bind the published ref and head before approval");
            assert(process.env.CI && process.platform === "linux", "this operation runs only on disposable Linux CI");
            assert(process.env.GH_TOKEN, "the existing read-only workflow token is required");
            assert.equal(process.versions.node, JSON.parse(readFileSync("package.json", "utf8")).engines.node);
            const actual = run("actual-source", "git", ["rev-parse", "HEAD"], 10000);
            assert.equal(actual.status, 0);
            assert.equal(actual.stdout.trim(), source);
            assert.equal(hash(original), checkerHash);
            assert.equal(hash(originalLaws), lawsHash);
            assert.equal(hash(readFileSync(".github/workflows/scheduled.yaml")), workflowHash);
            const current = run("remote-ref", "gh", ["api", "-X", "GET", `repos/${repo}/git/ref/heads/${encodeURIComponent(branch)}`], 60000, true);
            assert.equal(current.status, 0);
            assert.equal(JSON.parse(current.stdout).object.sha, head);
            const raw = run("immutable-yaml", "gh", ["api", "-X", "GET", `repos/${repo}/contents/.github/workflows/scheduled.yaml`,
              "-f", `ref=${head}`, "-H", "Accept: application/vnd.github.raw+json"], 60000, true);
            assert.equal(raw.status, 0);
            assert.equal(hash(raw.stdout), workflowHash, "published workflow must equal the approved shared-lock workflow");
            metadata.remoteWorkflowHash = hash(raw.stdout);
            const args = [preflight, "--repo", repo, "--branch", branch, "--head", head];
            const positive = run("live-positive", process.execPath, args, 60000, true);
            assert.equal(positive.status, 0);
            assert(positive.stdout.includes(`Shared job groups confirmed at ${head}.`));
            assert(!positive.stderr.includes("proof-preflight:"));
            const moved = run("live-moved-head", process.execPath,
              [preflight, "--repo", repo, "--branch", branch, "--head", "0".repeat(40)], 60000, true);
            assert.notEqual(moved.status, 0);
            assert(moved.stderr.includes(`moved from ${"0".repeat(40)} to ${head}`));
            assert(!moved.stdout.includes("Shared job groups confirmed"));
            fiveLaws("baseline-five", false);
            const marker = "// Proof preflight reads the workflow at its exact source head, without executing that source.";
            const index = original.toString("utf8").indexOf(marker);
            assert(index > 0 && original.toString("utf8").indexOf(marker, index + 1) === -1);
            changed = true;
            writeFileSync(checker, original.toString("utf8").slice(0, index));
            metadata.oldCliFault = "only the argv/CLI tail removed; exports, product laws and workflow unchanged";
            metadata.oldCliHash = hash(readFileSync(checker));
            const absent = run("live-missing-cli", process.execPath, args, 60000, true);
            assert.notEqual(absent.status, 0);
            assert(absent.stderr.includes("the trusted job-slot check did not confirm conformance"));
            assert(!absent.stdout.includes("Shared job groups confirmed"));
            fiveLaws("old-cli-five", true);
            writeFileSync(checker, original);
            changed = false;
            assert.equal(hash(readFileSync(checker)), checkerHash);
            fiveLaws("restored-five", false);
            assert.equal(hash(readFileSync(laws)), lawsHash);
            const cleanTree = run("restored-tree", "git", ["diff", "--exit-code", "--", checker, laws, ".github/workflows/scheduled.yaml"], 10000);
            assert.equal(cleanTree.status, 0);
            metadata.result = "all named checks passed";
          } catch (error) {
            metadata.failure = clean(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          } finally {
            if (changed) writeFileSync(checker, original);
            metadata.checkerRestored = hash(readFileSync(checker)) === checkerHash;
            metadata.lawsPreserved = hash(readFileSync(laws)) === lawsHash;
            save();
            console.log(JSON.stringify({ result: metadata.result, checkerRestored: metadata.checkerRestored,
              lawsPreserved: metadata.lawsPreserved, operations: records.length }));
          }
          JS
      - name: Preserve proof evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: ci-live-adapter-proof
          path: ${{ runner.temp }}/ci-live-adapter-proof
          if-no-files-found: error
          retention-days: 7
