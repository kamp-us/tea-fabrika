name: scheduled

# The full run, the whole suite (0534). The merge line runs only the tests a change reaches: a pull
# request, a merge queue group and a push to main each run the next/ tests their diff reaches, and
# none of them runs a tooling test (0539, check.yaml). This runs all of next/, every layer of it
# (0536): the in-memory tests, the real-resource ones (`*.integration.test.ts`) and the visual ones
# (`*.visual.test.ts`), which the merge line never runs, and every tooling test, on main's head. A
# push to main starts it when no full run on main started in the last hour, and an hourly catch-up
# starts it on a head that has had none (0581): the `gate` job decides (gate.mjs), so a break no
# diff reached shows within about an hour of its push, two at most when the next push is long in
# coming. A red run opens one GitHub issue labeled `ci-scheduled`, or comments on the open one, and
# a green run closes it (scheduled.mjs). Those are the only issues automation opens here.
#
# A run whose gate said `false` ends `success` in seconds, with `tests` and `report` skipped, and
# leaves the issue as it was; a run whose gate failed ends `failure`, with the report run and red.
# From probe runs of a throwaway copy of this file (43795273918, 43795308056), and with the report on
# `always()`, it ran on a skipped run too (43795341752). GitHub lists the skipped matrix as one job
# named `tests`, with no shard, which is how scheduled.mjs's `isFull` tells a full run.
#
# A red run ends `failure`, on main and on a branch, and only a run a person or a sev0's freeze
# canceled ends `cancelled`. On 2026-11-15 a red run on a branch that had canceled itself was read
# as cut off, and its pull request merged with two red laws. What GitHub does, from probe runs of a
# throwaway copy of this file (43778347612, 43778355238, 43778362939, 43778578495, 43778586135):
#
#   what happened in the run                                   the run's conclusion
#   a leg failed, its matrix's fail-fast canceled the others   failure
#   a leg failed, another leg of the matrix hit the job limit  failure
#   a test step hit its own step limit                         failure
#   a job hit its job limit, a later always() job failed       cancelled
#   a person canceled the run, a later always() job failed     cancelled
#
# So no step here cancels the run, every test leg sits in one matrix that fails fast, and the time
# limit sits on each test step (`timeout-minutes`, which ends the step `failure`), with the job's
# own limit a few minutes past it as a backstop for a hung setup or upload. workflow-lint.ts holds
# all of it (SC3 to SC6, SC13).
#
#   what            legs   how
#   gate            1      first; says start=true or start=false (gate.mjs), with the run list read
#                          by the workflow's own token
#   next/ vitest    5      check.yaml's next legs 1 to 5, the `next` and `next-integration`
#                          projects, every file, no `--changed`
#   next/ visual    2      check.yaml's legs e2e-1 and e2e-2, the `next-visual` project, every file
#   tooling tests   2      legs tooling-1 and tooling-2, the `tooling` project, every file, no
#                          `--changed`; the 9 legs above are one matrix, the `tests` job
#   report          1      after the others, on any result but the gate's `false`; it fails unless
#                          the run is green, so a run whose red leg left no failed job still ends
#                          `failure`
#
# Every test leg sets `FABRIKA_TEST_DEPTH: full`, so a law with a depth runs its full case count
# here; the merge line leaves it unset, which reads as `fast` (pull request 1274).
#
# 10 machines at most, half of the organization's 20 runners, so pull requests keep theirs:
# `max-parallel` on the matrix, which workflow-lint.ts adds up per step of the `needs` chain. The next legs are check.yaml's full
# matrix, and workflow-lint.ts keeps the two the same. Their split is not check.yaml's: at full
# depth a file takes longer, so `Shards` splits and orders these legs by the seconds measured here,
# vitest.shards.full.json (vitest.shards.ts). Refresh its rows from a leg's `results-next-N` report.
on:
  # Every push to main asks; the gate starts the run only when none started within the gap (0581).
  # Every path: the gate, not a path filter, decides.
  push:
    branches: [main]
  # The hourly catch-up (0581), at minute 17: GitHub delays and drops runs queued on the hour, when
  # most schedules start (its docs, "Events that trigger workflows", schedule). It starts a run only
  # on a head that has had none, and never within the gap.
  schedule:
    - cron: "17 * * * *"
  # By hand, on main, or on a branch, to run every test on it or to try a change to this file. Only
  # main's run writes the issue.
  workflow_dispatch:

# One run at a time, and a running one is never cut short: a newer one waits its turn. `queue: max`
# lets up to 100 wait, first in first out. GitHub's default keeps one waiting and cancels it when a
# newer run queues, so a hand-started branch run could cancel main's waiting scheduled run: two of
# the first three scheduled runs waited 10 and 13 minutes behind a hand-started one (GitHub's docs,
# "Control the concurrency of workflows and jobs").
concurrency:
  group: scheduled
  queue: max
  cancel-in-progress: false

# `actions: read` lets each leg's time table read its own job's steps, and no more: a token that
# cannot write actions cannot cancel a run. `contents: read` is the checkout's. The report job alone
# takes `issues: write`, in its own map. workflow-lint.ts holds all three.
permissions:
  actions: read
  contents: read

# The gap (0581, 0069): no full run on main starts within this many minutes of the last one, except
# by hand. An hour at least, 0581's binding constraint. The gate reads it; change this line to
# change it.
env:
  GAP_MINUTES: 60

jobs:
  # The gate (0581): whether this run starts the tests. A hand start always does; a push or the
  # catch-up does when no full run on main started within the gap, and only on a head that has had
  # none (gate.mjs). It runs while this run holds the `scheduled` group, so every run ahead of it
  # has ended. It reads the run list with the workflow's own token, which cannot cancel a run, and
  # its summary line says why. When it cannot read GitHub it fails and gives no `start`: the tests
  # skip and the report judges the run red. No install: the runner's own Node runs gate.mjs.
  #
  # Every way it ends with no `start` ends the job `failure`, so the report judges the run red:
  # each step has its own limit, which ends that step `failure`, and gate.mjs gives up loudly well
  # inside its step's (its `DEADLINE`). The job's own limit is only a backstop past both, since a job
  # that hits it ends `cancelled`, which the report reads as a run a person stopped (the review of
  # pull request 1404). Nothing here continues on error. workflow-lint.ts holds it (SC14).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      start: ${{ steps.decide.outputs.start }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          sparse-checkout: .github/ci
          persist-credentials: false
      - id: decide
        name: gate
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci/gate.mjs

  # Every test leg, in one matrix, so one `fail-fast` reaches them all: the first red leg stops the
  # other eight, as the stop step did before 2026-11-15, and the run still ends `failure`. Two
  # matrices would let a red tooling leg leave next's seven legs running, up to about 59 runner
  # minutes per red run (the review of pull request 1383, at green run 43775455200's leg times).
  #
  # All of next/, on check.yaml's full matrix of legs: `1` to `5` run vitest over the `next` and
  # `next-integration` projects, each a fifth of the files by measured seconds; `e2e-1` and `e2e-2`
  # fetch chromium and run the `next-visual` project on their half of the visual files. A project,
  # not a path, picks the files: `next/` as a path would start `next-visual` on legs with no
  # Chromium. Then every tooling test, on `tooling-1` and `tooling-2`: the tests of neither
  # version's product code (CI's own, the lint plugins, the root scripts and the skill scripts),
  # the `tooling` project, since a project ignores `--exclude` (0536). The only CI job that runs
  # them: the merge line runs none, and a tooling change's author runs its narrow tests on the
  # laptop (0539). Today's tests run in no CI job (0533). Nothing is narrowed: no `--changed`, no
  # list.
  tests:
    needs: [gate]
    if: needs.gate.outputs.start == 'true'
    runs-on: ubuntu-latest
    # A backstop: the leg's test step limit (`next-limit` or `tooling-limit` below) and 3 minutes
    # more, so 20 for a next leg and 33 for a tooling leg (GitHub's docs, "Contexts reference": this
    # key may read `matrix`). In green runs 43765797242, 43734956911 and 43734841211 the steps
    # before a test step took at most 56 s in all (chromium's included) and the three after it at
    # most 7 s, against their 2 minutes of step limits. A job that hits this limit ends `cancelled`
    # and so does its run, so only a hung setup or upload reaches it; the report still names it as a
    # time-out.
    timeout-minutes: ${{ startsWith(matrix.shard, 'tooling-') && 33 || 20 }}
    # Fail fast, GitHub's own (ticket 990): the first red leg stops every other leg, so they free
    # their runners, and the run still ends `failure`. Every leg at once: 9, and the report job
    # after them, 10 machines; the gate runs before them, alone.
    strategy:
      fail-fast: true
      max-parallel: 9
      matrix:
        shard: ["e2e-1", "e2e-2", "1", "2", "3", "4", "5", "tooling-1", "tooling-2"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/pnpm

      - run: pnpm install --frozen-lockfile
      # check.yaml's next limit, for the same legs, on the test step itself: a step that runs into
      # it ends `failure`, and so does the run. The report reads it through the alias, to name a leg
      # that ran into it as a time-out.
      - name: vitest
        if: ${{ !startsWith(matrix.shard, 'e2e-') && !startsWith(matrix.shard, 'tooling-') }}
        timeout-minutes: &next-limit 17
        env:
          SHARD: ${{ matrix.shard }}/5
          FABRIKA_TEST_DEPTH: full
        run: pnpm exec vitest run --project next --project next-integration --shard "$SHARD" --reporter=default --reporter=json --reporter=github-actions --outputFile.json="$RUNNER_TEMP/results.json"
      # `--with-deps` runs apt itself, with no limit. apt.sh refreshes the lists first, on a mirror
      # that answers, as in check.yaml.
      - name: chromium
        if: startsWith(matrix.shard, 'e2e-') && hashFiles('next/**/*.visual.test.ts', 'next/**/*.visual.test.tsx') != ''
        run: |
          sudo sh .github/ci/apt.sh update
          pnpm --filter @kampus/fabrika exec playwright install --with-deps chromium
      # Leg `e2e-k` runs shard `k/2` of the visual files: `${SHARD#e2e-}` drops the leg's prefix.
      - name: end to end
        if: startsWith(matrix.shard, 'e2e-')
        timeout-minutes: *next-limit
        env:
          SHARD: ${{ matrix.shard }}/2
          FABRIKA_TEST_DEPTH: full
        run: pnpm exec vitest run --project next-visual --shard "${SHARD#e2e-}" --reporter=default --reporter=json --reporter=github-actions --outputFile.json="$RUNNER_TEMP/results.json"
      # Leg `tooling-k` runs shard `k/2` of the tooling tests, with the limit check.yaml's tooling
      # legs had before 0539 took them off the merge line, on the step itself, as next's.
      - name: tooling tests
        if: startsWith(matrix.shard, 'tooling-')
        timeout-minutes: &tooling-limit 30
        env:
          SHARD: ${{ matrix.shard }}/2
          FABRIKA_TEST_DEPTH: full
        run: pnpm exec vitest run --project tooling --shard "${SHARD#tooling-}" --passWithNoTests --reporter=default --reporter=json --reporter=github-actions --outputFile.json="$RUNNER_TEMP/results.json"
      # The leg's Vitest report, for the report job to name each failing test. After a red step too,
      # so the leg that failed is the one whose report is kept. Named `results-next-<leg>` and
      # `results-tooling-<k>`, as before the two jobs became one: vitest.shards.ts's rows are
      # refreshed from them.
      - name: results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ startsWith(matrix.shard, 'tooling-') && matrix.shard || format('next-{0}', matrix.shard) }}
          path: ${{ runner.temp }}/results.json
          if-no-files-found: ignore
          retention-days: 7
      # The leg's time table (time-table.ts), as in check.yaml: each step's seconds from GitHub's jobs
      # API, read with the workflow's token, and the ten slowest test files of the leg's report, in
      # the job summary. On every result, and it never fails the job. Last of the job's commands.
      - name: time table
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LEG: ${{ matrix.shard }}
          REPORT: ${{ runner.temp }}/results.json
        run: node .github/ci/time-table.ts
      # The same numbers as one small JSON per leg, to follow each leg's balance over time. The run
      # attempt is in its name, so a rerun keeps the first attempt's file beside its own. Its own
      # limit, as the time table's: each upload took about 1 s on check run 43657196726.
      - name: timings
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ github.job }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/timings-${{ github.job }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 90

  # The verdict. On main: red opens one `ci-scheduled` issue naming the commits since the last
  # green full run, the legs that made it red and the failing tests, or comments on the open
  # one; a leg that ran into its time limit is red, named as a time-out; green closes it; a run
  # stopped by hand does nothing. On a branch it writes nothing. On both it fails unless the run is
  # green (scheduled.mjs), so a red run with no failed job, such as a leg that ended odd, still ends
  # `failure`; its failure cannot turn a run GitHub ends `cancelled` into one (probe run
  # 43778355238). `always()`, so it runs after a red leg, as ci-required does in check.yaml, unless
  # the gate said `false`: a skipped run proves nothing and leaves the issue as it was. The
  # one job with `issues: write`, and `actions: read` to read the run's jobs and steps and find
  # the last green run: `needs` folds a matrix's legs into one result. No install: the runner's own
  # Node runs scheduled.mjs.
  report:
    needs: [gate, tests]
    if: always() && needs.gate.outputs.start != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
          persist-credentials: false
      # A run that broke before any leg wrote a report has none to fetch; the report says so.
      - name: results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: results-*
          path: ${{ runner.temp }}/results
      # Each test job's test step limit, an alias of its own line, so the limit stays one setting. A
      # step that ran into it ends `failure` like a red test, and a job that ran into its backstop
      # ends `cancelled` like a leg stopped after another leg failed, so only the run time against
      # this limit tells a time-out apart (scheduled.mjs's `ending`).
      - name: report
        env:
          NEEDS: ${{ toJSON(needs) }}
          RESULTS: ${{ runner.temp }}/results
          GITHUB_TOKEN: ${{ github.token }}
          LIMIT_NEXT: *next-limit
          LIMIT_TOOLING: *tooling-limit
        run: node .github/ci/scheduled.mjs
