name: pnpm
description: >-
  pnpm and Node, with the pnpm store restored from the cache. It never saves: a job that saves
  calls actions/cache/save with this action's `store` and `key`, on main only.

# setup-node's own `cache: pnpm` saved the store from every ref it ran on: each pull request, each
# merge queue group and main, 527 MiB on Linux and 922 MiB on macOS each time. On 2026-11-14 the
# repository's Actions cache held 10.6 GB in 19 entries, over GitHub's 10 GB, so GitHub evicted
# the least recently used; 7.5 GB of it sat on refs other than main
# (`gh api repos/kamp-us/tea-fabrika/actions/cache/usage`, and `.../actions/caches` for each
# entry). Any ref can restore what main saved, so main's one copy serves them all. setup-node also
# matched only the exact lockfile hash; the restore key here lets a changed lockfile start from
# main's last store and fetch only the difference.

outputs:
  store:
    description: The pnpm store's folder.
    value: ${{ steps.store.outputs.path }}
  key:
    description: The cache key for this lockfile.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  hit:
    description: true when the cache held this exact lockfile's store.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The pnpm version comes from `packageManager` in package.json.
    - uses: pnpm/action-setup@v6
      with:
        run_install: false

    - uses: actions/setup-node@v7
      with:
        node-version: 26.13.0

    - id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
