# Where each kind of record lives, and what goes in it. Agents read this file directly.
[[records]]
name = "decisions"
path = ".kalfa/decisions/"
prompt = "The ADR format in the `domain-modeling` skill. Before you change a choice, read the decisions that govern it. Write one with the adr skill, only when the choice is hard to reverse, surprising without context, and the result of a real trade-off. To change a choice, write a new decision first, then reword the old one's changed lines, each with a pointer to the new one, and touch nothing else in it. An old one replaced whole keeps its text and gets `status: superseded by ADR-NNNN`. A ruling that fails those tests and that a lint rule, a check or a tool setting enforces gets no ADR: its why is a comment beside the enforcement. A ruling not built yet is a spec on the tracker, the ruling as its requirements; once built, the code holds it, and it gets an ADR only if building it proved hard to reverse. A setting is code: its value lives in its config file."

[[records]]
name = "glossary"
path = ".kalfa/glossary/"
prompt = "GLOSSARY-MAP.md is the map of bounded contexts. Each context's words live in its own GLOSSARY.md, in the glossary format in the `domain-modeling` skill: only words a caller of that context sees. A context's GLOSSARY.md is written when its words are decided. A term goes in with an _Avoid_ line, in the pull request that coins or renames it."

[[records]]
name = "guidelines"
path = ".kalfa/guidelines/"
prompt = "One design area's rules, approved by the owner. Read an area's page whole before you change that area, and write one with the guidelines skill. Change a rule only by editing its page, in a pull request the owner says yes to."

[[records]]
name = "patterns"
path = ".kalfa/patterns/"
prompt = "How the code is shaped now, one doc per pattern. Find one with README.md and `rg -n '^(where|when):' .kalfa/patterns`, then read the doc for your change. A fact about how the code is shaped now, such as a service's name, lives here or in the code. Write one with the write-pattern skill. When a doc and the source disagree, the source wins and the doc gets fixed."

[[records]]
name = "runbooks"
path = ".kalfa/runbooks/"
prompt = "One file per operation done by hand, such as a sev or a wipe of the dev and test homes. Read that operation's file before you do it. A runbook is written the first time its operation is done for real."

[[records]]
name = "quests"
path = ".kalfa/quests/"
prompt = "One signed plan per ticket, approved by the owner before its tests are written. The test writer, the builder and the review read it as the contract."

[[records]]
name = "research"
path = ".kalfa/research/"
prompt = "The research format in the `research` skill: one file per question, answered from high-trust primary sources, each claim cited. Any reading of outside sources lives here, wherever it was first written."

[[records]]
name = "retro"
path = ".kalfa/retro/"
prompt = "The retro format in the `retro` skill: one file per session worth learning from."
